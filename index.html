<style>

<script type="module">
import * as THREE from 'three';
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);

/* ---------- toast ---------- */
let toastT;
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>e.style.opacity=0,2600);}

/* ---------- audio (WebAudio synth, no assets) ---------- */
const AU={ctx:null,g:null};
function audioInit(){if(AU.ctx)return;AU.ctx=new (window.AudioContext||window.webkitAudioContext)();AU.g=AU.ctx.createGain();AU.g.gain.value=.5;AU.g.connect(AU.ctx.destination);}
function noiseBuf(dur){const n=AU.ctx.sampleRate*dur|0,b=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return b;}
function sfxShot(vol=.5,pitch=1){if(!AU.ctx)return;const c=AU.ctx,t=c.currentTime;
  const s=c.createBufferSource();s.buffer=noiseBuf(.12);const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=2600*pitch;
  const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);
  s.connect(f);f.connect(g);g.connect(AU.g);s.start(t);
  const o=c.createOscillator();o.type='triangle';o.frequency.setValueAtTime(160*pitch,t);o.frequency.exponentialRampToValueAtTime(40,t+.09);
  const g2=c.createGain();g2.gain.setValueAtTime(vol*.8,t);g2.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(g2);g2.connect(AU.g);o.start(t);o.stop(t+.12);}
function sfxTone(freq,dur,vol=.25,type='square'){if(!AU.ctx)return;const c=AU.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(AU.g);o.start(t);o.stop(t+dur);}
const sfx={hit:()=>sfxTone(1200,.06,.2,'square'),hurt:()=>sfxTone(140,.2,.4,'sawtooth'),reload:()=>{sfxTone(500,.05,.2);setTimeout(()=>sfxTone(700,.05,.2),350);},death:()=>{sfxTone(90,.4,.4,'sawtooth');},wave:()=>{sfxTone(220,.5,.3,'triangle');setTimeout(()=>sfxTone(330,.5,.3,'triangle'),250);},ekill:()=>sfxTone(60,.35,.35,'sawtooth'),join:()=>sfxTone(880,.12,.2,'sine')};

/* ---------- three.js scene ---------- */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a1410);
scene.fog=new THREE.Fog(0x0a1410,30,110);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,300);
const hemi=new THREE.HemisphereLight(0xbfd8cc,0x1a2a22,.9);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2dd,1.1);sun.position.set(30,50,20);scene.add(sun);
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
addEventListener('resize',resize);resize();

/* seeded rng for the shared map */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* ---------- world ---------- */
const ARENA=38, WALL_H=4;
const colliders=[]; // {minX,maxX,minZ,maxZ, h}
function addBox(x,z,w,d,h,color,ry=0){
  const g=new THREE.BoxGeometry(w,h,d);
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color}));
  m.position.set(x,h/2,z);m.rotation.y=ry;scene.add(m);
  if(Math.abs(ry)>0.01){ // rotated: approximate AABB
    const c=Math.abs(Math.cos(ry)),s=Math.abs(Math.sin(ry));
    const W=(w*c+d*s)/2,D=(w*s+d*c)/2;
    colliders.push({minX:x-W,maxX:x+W,minZ:z-D,maxZ:z+D});
  } else colliders.push({minX:x-w/2,maxX:x+w/2,minZ:z-d/2,maxZ:z+d/2});
  return m;
}
function buildWorld(){
  const rng=mulberry(1337);
  // floor with grid texture
  const gc=document.createElement('canvas');gc.width=gc.height=256;const g2=gc.getContext('2d');
  g2.fillStyle='#16241d';g2.fillRect(0,0,256,256);g2.strokeStyle='#1f3830';g2.lineWidth=2;
  for(let i=0;i<=256;i+=32){g2.beginPath();g2.moveTo(i,0);g2.lineTo(i,256);g2.stroke();g2.beginPath();g2.moveTo(0,i);g2.lineTo(256,i);g2.stroke();}
  const tex=new THREE.CanvasTexture(gc);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(10,10);
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(ARENA*2,ARENA*2),new THREE.MeshLambertMaterial({map:tex}));
  floor.rotation.x=-Math.PI/2;scene.add(floor);
  // perimeter walls
  const wallMat=new THREE.MeshLambertMaterial({color:0x24443a});
  for(const [x,z,w,d] of [[0,ARENA,ARENA*2+2,1],[0,-ARENA,ARENA*2+2,1],[ARENA,0,1,ARENA*2+2],[-ARENA,0,1,ARENA*2+2]]){
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,WALL_H,d),wallMat);m.position.set(x,WALL_H/2,z);scene.add(m);
    colliders.push({minX:x-w/2,maxX:x+w/2,minZ:z-d/2,maxZ:z+d/2});
  }
  // obstacle course: long covers + crates (shared seed)
  addBox(-12,-8,14,1.2,3,0x2e5a48); addBox(12,8,14,1.2,3,0x2e5a48);
  addBox(-8,12,1.2,14,3,0x2e5a48);  addBox(8,-12,1.2,14,3,0x2e5a48);
  addBox(0,0,6,6,2.4,0x35684f); // center block
  for(let i=0;i<12;i++){
    const x=(rng()*2-1)*32,z=(rng()*2-1)*32;
    if(Math.abs(x)<5&&Math.abs(z)<5)continue;
    const s=rnd(1.8,3.4);
    addBox(x,z,s,s,rnd(1.4,2.6),[0x3a5c3a,0x546b3a,0x3a5468][i%3]);
  }
  // light poles for silhouette
  for(const [x,z] of [[-20,-20],[20,20],[-20,20],[20,-20]]){
    const p=new THREE.Mesh(new THREE.CylinderGeometry(.15,.2,7,8),new THREE.MeshLambertMaterial({color:0x223528}));
    p.position.set(x,3.5,z);scene.add(p);colliders.push({minX:x-.3,maxX:x+.3,minZ:z-.3,maxZ:z+.3});
    const bulb=new THREE.PointLight(0x39d98a,.6,18);bulb.position.set(x,6.5,z);scene.add(bulb);
  }
}
buildWorld();
const GATES=[V3(0,0,-ARENA+2),V3(0,0,ARENA-2),V3(-ARENA+2,0,0),V3(ARENA-2,0,0)];

function hitSolid(x,z,r=.45){
  for(const c of colliders)if(x>c.minX-r&&x<c.maxX+r&&z>c.minZ-r&&z<c.maxZ+r)return c;
  return null;
}

/* ---------- player ---------- */
const player={x:0,z:24,y:0,vy:0,ry:Math.PI,pitch:0,hp:100,dead:false,lastHurt:0,
  mag:30,reserve:Infinity,reloading:0,lastShot:0,score:0,kills:0,onGround:true,speed:5.2};
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reload();});
addEventListener('keyup',e=>keys[e.code]=false);
let locked=false;
canvas.addEventListener('click',()=>{if(state==='play'&&!locked)canvas.requestPointerLock();audioInit();});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===canvas;if(!locked&&state==='play')showPause(true);});
addEventListener('mousemove',e=>{if(!locked)return;player.ry-=e.movementX*.0022;player.pitch=clamp(player.pitch-e.movementY*.0022,-1.45,1.45);});

function movePlayer(dt){
  if(player.dead)return;
  const f=(keys.KeyW?1:0)-(keys.KeyS?1:0), s=(keys.KeyD?1:0)-(keys.KeyA?1:0);
  const sp=(keys.ShiftLeft||keys.ShiftRight)?8.2:5.2;
  let dx=0,dz=0;
  if(f||s){const a=player.ry,len=Math.hypot(f,s);
    dx=(-Math.sin(player.ry)*f+Math.cos(player.ry)*s)/len*sp;
    dz=(-Math.cos(player.ry)*f-Math.sin(player.ry)*s)/len*sp;}
  // jump / gravity
  if(keys.Space&&player.onGround){player.vy=7;player.onGround=false;}
  player.vy-=20*dt;player.y+=player.vy*dt;
  if(player.y<=0){player.y=0;player.vy=0;player.onGround=true;}
  // slide collisions
  let nx=player.x+dx*dt; if(!hitSolid(nx,player.z))player.x=clamp(nx,-ARENA+1,ARENA-1);
  let nz=player.z+dz*dt; if(!hitSolid(player.x,nz))player.z=clamp(nz,-ARENA+1,ARENA-1);
}

/* gun viewmodel */
const gun=new THREE.Group();
const gbody=new THREE.Mesh(new THREE.BoxGeometry(.09,.12,.5),new THREE.MeshLambertMaterial({color:0x222a26}));
const gbarrel=new THREE.Mesh(new THREE.BoxGeometry(.05,.05,.34),new THREE.MeshLambertMaterial({color:0x111511}));gbarrel.position.set(0,.02,-.4);
const gsight=new THREE.Mesh(new THREE.BoxGeometry(.02,.05,.02),new THREE.MeshLambertMaterial({color:0x39d98a}));gsight.position.set(0,.085,-.1);
gun.add(gbody,gbarrel,gsight);gun.position.set(.22,-.18,-.35);camera.add(gun);scene.add(camera);
let recoil=0;
const flash=new THREE.PointLight(0xffd27a,0,6);flash.position.set(0,0,-.7);camera.add(flash);

/* tracers */
const tracers=[];
function tracer(from,to,color=0xffe2a8,life=90){
  const g=new THREE.BufferGeometry().setFromPoints([from.clone(),to.clone()]);
  const l=new THREE.Line(g,new THREE.LineBasicMaterial({color,transparent:true,opacity:.9}));
  scene.add(l);tracers.push({l,t:life});
}
const sparks=[];
function spark(p,color=0xffd27a){
  const m=new THREE.Mesh(new THREE.SphereGeometry(.07,6,6),new THREE.MeshBasicMaterial({color,transparent:true}));
  m.position.copy(p);scene.add(m);sparks.push({m,t:260,vy:rnd(1,3)});
}
function updFx(dt){
  for(let i=tracers.length-1;i>=0;i--){const t=tracers[i];t.t-=dt*1000;if(t.t<=0){scene.remove(t.l);t.l.geometry.dispose();tracers.splice(i,1);}else t.l.material.opacity=t.t/90*.9;}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.t-=dt*1000;s.m.position.y+=s.vy*dt;s.vy-=6*dt;if(s.t<=0){scene.remove(s.m);sparks.splice(i,1);}else s.m.material.opacity=s.t/260;}
}

/* ---------- bots ---------- */
const BOT_COLORS=[0xc0392b,0xd35400,0x8e44ad,0x16a085];
const raycaster=new THREE.Raycaster();
let botSeq=1;
const bots=new Map();
const botParts=[]; // meshes for raycast, userData.botId
function makeBot(id,x,z){
  const g=new THREE.Group();
  const c=BOT_COLORS[id%BOT_COLORS.length];
  const body=new THREE.Mesh(new THREE.BoxGeometry(.75,1.15,.5),new THREE.MeshLambertMaterial({color:c}));body.position.y=.95;
  const head=new THREE.Mesh(new THREE.BoxGeometry(.5,.5,.5),new THREE.MeshLambertMaterial({color:0x1c2723}));head.position.y=1.78;
  const gunm=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.7),new THREE.MeshLambertMaterial({color:0x111511}));gunm.position.set(.3,1.15,-.35);
  const legL=new THREE.Mesh(new THREE.BoxGeometry(.25,.55,.3),new THREE.MeshLambertMaterial({color:0x222b26}));legL.position.set(-.2,.28,0);
  const legR=legL.clone();legR.position.x=.2;
  g.add(body,head,gunm,legL,legR);g.position.set(x,0,z);scene.add(g);
  const b={id,grp:g,x,z,ry:0,hp:100,dead:false,deadT:0,shootT:rnd(.5,1.5),strafe:Math.random()<.5?1:-1,strafeT:rnd(1,2),anim:0,hitFlash:0,
    parts:[body,head]};
  body.userData.botId=id;head.userData.botId=id;
  botParts.push(body,head);
  return b;
}
function removeBot(b){
  scene.remove(b.grp);
  const i=botParts.indexOf(b.parts[0]);if(i>=0)botParts.splice(i,2);
}
function losClear(ax,az,ay,bx,bz,by){
  const o=V3(ax,ay,az),d=V3(bx-ax,by-ay,bz-az),dist=d.length();if(dist<0.001)return true;
  raycaster.set(o,d.normalize());raycaster.far=dist-.3;
  return raycaster.intersectObjects(worldMeshes,false).length===0;
}
const worldMeshes=[]; // filled after buildWorld
scene.traverse(o=>{if(o.parent===scene&&o.isMesh&&o.geometry&&o.geometry.type==='BoxGeometry'&&!o.userData.botId)worldMeshes.push(o);});
// note: floor is a plane, excluded; walls/crates/poles captured
function botAI(b,dt,targets){
  if(b.dead){b.deadT+=dt;b.grp.rotation.x=Math.min(Math.PI/2,b.grp.rotation.x+dt*4);b.grp.position.y=-Math.min(1,b.deadT)*0.1;
    b.grp.traverse(o=>{if(o.material){o.material.transparent=true;o.material.opacity=Math.max(0,1-b.deadT/1.4);}});
    if(b.deadT>1.6){removeBot(b);bots.delete(b.id);}return;}
  if(b.hitFlash>0){b.hitFlash-=dt;b.grp.traverse(o=>{if(o.material&&o.material.emissive)o.material.emissive.setHex(b.hitFlash>0?0x883333:0x000000);});}
  // pick nearest target
  let best=null,bd=1e9;
  for(const t of targets){const d=Math.hypot(t.x-b.x,t.z-b.z);if(t.hp>0&&d<bd){bd=d;best=t;}}
  if(!best)return;
  const dx=best.x-b.x,dz=best.z-b.z,dist=bd;
  const clear=losClear(b.x,b.z,1.6,best.x,best.z,1.2);
  b.anim=clear&&dist<26?2:1;
  let mvx=0,mvz=0;const sp=dist>16?4.6:2.6;
  if(!clear||dist>14){mvx=dx/dist*sp;mvz=dz/dist*sp;}
  else{ // strafe
    b.strafeT-=dt;if(b.strafeT<=0){b.strafe*=-1;b.strafeT=rnd(.8,2);}
    mvx=-dz/dist*2.2*b.strafe;mvz=dx/dist*2.2*b.strafe;}
  // steer around solids
  let nx=b.x+mvx*dt,nz=b.z+mvz*dt;
  if(hitSolid(nx,nz,.4)){const a=Math.atan2(mvz,mvx)+ (b.strafe)*1.4;nx=b.x+Math.cos(a)*sp*dt;nz=b.z+Math.sin(a)*sp*dt;
    if(hitSolid(nx,nz,.4)){nx=b.x;nz=b.z;}}
  b.x=clamp(nx,-ARENA+1,ARENA-1);b.z=clamp(nz,-ARENA+1,ARENA-1);
  b.ry=Math.atan2(dx,dz);
  // shooting
  b.shootT-=dt;
  if(clear&&dist<26&&b.shootT<=0){
    b.shootT=rnd(.8,1.5);
    const from=V3(b.x,1.6,b.z);
    const hitChance=clamp(.85-dist*.028,.15,.8);
    const hit=Math.random()<hitChance&&best.hp>0;
    const to=V3(best.x+rnd(-1,1)*(hit?.2:2.2),1.3+rnd(-.4,.5),best.z+rnd(-1,1)*(hit?.2:2.2));
    botFire(b,from,to,hit,best);
  }
}

/* ---------- shooting ---------- */
let firing=false,mouseDown=false;
addEventListener('mousedown',e=>{if(e.button===0&&locked)mouseDown=true;});
addEventListener('mouseup',e=>{if(e.button===0)mouseDown=false;});
addEventListener('contextmenu',e=>e.preventDefault());
function reload(){if(player.reloading>0||player.mag===30)return;player.reloading=1.5;sfx.reload();gun.position.z=-.2;}
function fire(){
  if(player.reloading>0||player.dead)return;
  if(player.mag<=0){reload();return;}
  if(performance.now()-player.lastShot<125)return;
  player.lastShot=performance.now();player.mag--;recoil=1;
  flash.intensity=2.2;setTimeout(()=>flash.intensity=0,50);
  sfxShot(.5,1);
  raycaster.setFromCamera({x:0,y:0},camera);raycaster.far=90;
  const targets=[...botParts,...worldMeshes];
  const hits=raycaster.intersectObjects(targets,false);
  const tip=new THREE.Vector3();gbarrel.getWorldPosition(tip);
  let end=raycaster.ray.at(90,V3(0,0,0));
  if(hits.length){
    const h=hits[0];end=h.point;
    spark(h.point);
    if(h.object.userData.botId!==undefined){
      sfx.hit();hitmark();
      const d=h.object.userData.head?50:25;
      if(isHost||!net.on)applyBotDamage(h.object.userData.botId,d,false);
      else netSend({t:'hb',b:h.object.userData.botId,d});
    }
  }
  tracer(tip,end);
  updHUD();
}
let hmT;
function hitmark(){const e=$('hm');e.style.opacity=1;clearTimeout(hmT);hmT=setTimeout(()=>e.style.opacity=0,120);}

/* ---------- damage / death ---------- */
function applyDamage(d,who){
  if(player.dead)return;
  player.hp-=d;player.lastHurt=performance.now();
  $('vig').style.opacity=.9;setTimeout(()=>$('vig').style.opacity=Math.max(0,(1-player.hp/100)*.5),300);
  sfx.hurt();
  if(player.hp<=0){player.hp=0;die(who);}
  updHUD();
}
let respawnT=0;
function die(who){
  player.dead=true;respawnT=3.5;sfx.death();kfAdd((who||'бот')+' → <b>'+nick+'</b>');
  if(mode==='solo'){state='dead';$('gostat').innerHTML='очки: <b>'+player.score+'</b> · волн пройдено: <b>'+(waveN-1)+'</b> · убийств: <b>'+player.kills+'</b>';$('go').style.display='flex';document.exitPointerLock();}
}
function respawn(){
  player.hp=100;player.dead=false;player.x=[-30,30,0,0][Math.floor(rnd(0,4))];player.z=[0,0,-30,30][Math.floor(rnd(0,4))];player.y=0;
  $('vig').style.opacity=0;updHUD();
}

/* ---------- bot fire ---------- */
function botFire(b,from,to,hit,victim){
  tracer(from,to,0xff8a5c);
  spark(to,0xff8a5c);
  const dist=camera.position.distanceTo(from);
  if(dist<30)sfxShot(clamp(.4-dist*.012,.05,.4),.7);
  const dmg=hit?9:0;
  if(victim&&victim.me){if(hit)applyDamage(dmg,'бот #'+b.id);}
  if((isHost||!net.on)&&net.on){netSend({t:'bs',i:b.id,o:[+from.x.toFixed(1),+from.y.toFixed(1),+from.z.toFixed(1)],p:[+to.x.toFixed(1),+to.y.toFixed(1),+to.z.toFixed(1)],v:victim?(victim.me?-1:victim.id):-1,d:dmg});}
}
function applyBotDamage(id,d,hs){
  const b=bots.get(id);if(!b||b.dead)return;
  b.hp-=d;b.hitFlash=.15;
  if(b.hp<=0){b.dead=true;
    if(isHost||!net.on){player.score+=hs?200:100;player.kills++;kfAdd('<b>'+nick+'</b> → бот #'+id+' '+(hs?'×2':'')+' +'+(hs?200:100));checkWave();}
  }
}

/* ---------- waves (host) ---------- */
let waveN=0,spawnQ=0,spawnT=0,interT=0;
function startWave(n){
  waveN=n;spawnQ=3+2*n;spawnT=1;interT=0;
  showBanner('ВОЛНА '+n,mode==='solo'?'':'удачи');sfx.wave();updHUD();
}
function checkWave(){
  if((isHost||!net.on)&&spawnQ===0&&bots.size===0&&waveN>0&&!player.dead){
    player.score+=250;showBanner('ВОЛНА '+waveN+' ПРОЙДЕНА','+250 очков');
    setTimeout(()=>{if(state==='play')startWave(waveN+1);},3500);
  }
}
function updWaves(dt){
  if(!(isHost||!net.on))return;
  if(spawnQ>0){spawnT-=dt;if(spawnT<=0){spawnT=.9;
    const g=GATES[Math.floor(rnd(0,4))];
    const b=makeBot(botSeq++,g.x+rnd(-3,3),g.z+rnd(-3,3));
    bots.set(b.id,b);spawnQ--;}}
}

/* ---------- banner / killfeed / HUD ---------- */
let banT;
function showBanner(t,sub){const e=$('banner');e.innerHTML=t+(sub?'<small>'+sub+'</small>':'');e.style.opacity=1;clearTimeout(banT);banT=setTimeout(()=>e.style.opacity=0,2200);}
function kfAdd(html){const kf=$('kf');kf.style.display='block';const d=document.createElement('div');d.innerHTML=html;kf.prepend(d);
  while(kf.children.length>5)kf.lastChild.remove();setTimeout(()=>{d.style.opacity=0;setTimeout(()=>d.remove(),400);},4000);}
function updHUD(){
  $('hpfill').style.width=player.hp+'%';
  $('hpfill').style.background=player.hp>50?'linear-gradient(90deg,#39d98a,#2bd1b1)':player.hp>25?'linear-gradient(90deg,#e2b93b,#e2d43b)':'linear-gradient(90deg,#e25b3b,#e23b3b)';
  $('ammo').textContent=player.reloading>0?'…':player.mag;
  $('waven').textContent=waveN;
  if(net.on){const names=[];for(const[cid,r]of remotes)names.push(r.name||'игрок'+cid);
    $('coop').style.display='block';
    $('coop').innerHTML='<b>КОМНАТА '+roomCode+'</b> · '+(isHost?'хост':'гость')+'<div>'+names.map(n=>'· '+n).join('<br>')+'</div><div>очки: '+player.score+'</div>';
  } else $('coop').style.display='none';
}

/* ---------- remote players ---------- */
const REM_COLORS=[0x39d98a,0x4da3ff,0xffd24d,0xff7ad9,0x9d7aff,0x7affd2,0xffa04d,0xd9ff4d];
const remotes=new Map();
function makeNameSprite(text,color){
  const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');
  g.font='bold 30px Segoe UI';g.textAlign='center';g.fillStyle='rgba(0,0,0,.45)';
  const w=g.measureText(text).width+24;g.fillRect(128-w/2,6,w,44);g.fillStyle=color;g.fillText(text,128,38);
  const t=new THREE.CanvasTexture(c);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true}));
  s.scale.set(1.6,.4,1);s.position.y=2.3;return s;
}
function ensureRemote(cid,name){
  if(remotes.has(cid))return remotes.get(cid);
  const col=REM_COLORS[cid%REM_COLORS.length];
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(.7,1.15,.45),new THREE.MeshLambertMaterial({color:col}));body.position.y=.95;
  const head=new THREE.Mesh(new THREE.BoxGeometry(.48,.48,.48),new THREE.MeshLambertMaterial({color:0x1c2723}));head.position.y=1.76;
  const legL=new THREE.Mesh(new THREE.BoxGeometry(.24,.55,.28),new THREE.MeshLambertMaterial({color:0x222b26}));legL.position.set(-.19,.28,0);
  const legR=legL.clone();legR.position.x=.19;
  g.add(body,head,legL,legR);
  const tag=makeNameSprite(name||'игрок'+cid,'#'+col.toString(16).padStart(6,'0'));
  g.add(tag);scene.add(g);
  const r={grp:g,body,head,legL,legR,name,x:0,y:0,z:0,ry:0,tx:0,ty:0,tz:0,t_ry:0,hp:100,dead:false,last:0,hitT:0};
  remotes.set(cid,r);sfx.join();kfAdd('<b>'+(name||'игрок'+cid)+'</b> в игре');
  updHUD();return r;
}
function dropRemote(cid){
  const r=remotes.get(cid);if(!r)return;scene.remove(r.grp);remotes.delete(cid);updHUD();
}

/* ---------- network ---------- */
const net={ws:null,on:false,alive:false,sT:0,bT:0};
const nick=localStorage.getItem('arenaNick')||'игрок';
let myId=0,isHost=true,roomCode=null,mode='solo';
function netSend(d){if(net.ws&&net.ws.readyState===1)net.ws.send(JSON.stringify(d));}
function netConnect(code){
  roomCode=code;
  const proto=location.protocol==='https:'?'wss':'ws';
  net.ws=new WebSocket(proto+'://xshell.xyz/game-ws/'+code);
  net.on=true;net.alive=false;
  net.ws.onmessage=e=>{
    let m;try{m=JSON.parse(e.data);}catch(_){return;}
    if(m.t==='welcome'){myId=m.id;isHost=m.host;net.alive=true;for(const p of m.players)ensureRemote(p);updHUD();return;}
    if(m.t==='join'){ensureRemote(m.id);return;}
    if(m.t==='leave'){dropRemote(m.id);return;}
    if(m.t==='host'){if(m.id===myId){if(!isHost){isHost=true;startWave(Math.max(1,waveN));toast('ты теперь хост комнаты');}}return;}
    if(m.t==='msg'){handleNet(m.id,m.d);return;}
  };
  net.ws.onclose=()=>{if(state==='play'){net.alive=false;if(net.on){toast('связь с комнатой потеряна, играем оффлайн');isHost=true;if(waveN===0)startWave(1);}net.on=false;updHUD();}};
  net.ws.onerror=()=>{};
}
function handleNet(cid,d){
  switch(d.t){
    case 's':{const r=ensureRemote(cid,d.n);r.name=d.n||r.name;r.tx=d.x;r.ty=d.y;r.tz=d.z;r.t_ry=d.ry;r.pitch=d.p;r.hp=d.hp;r.dead=d.d;d0(r,d);break;}
    case 'hb': if(isHost)applyBotDamage(d.b,d.d,false);break;
    case 'ph': if(d.g===myId)applyDamage(d.d,'игрок');break;
    case 'b': if(!isHost)applyBotsState(d);break;
    case 'bs':{const from=V3(d.o[0],d.o[1],d.o[2]),to=V3(d.p[0],d.p[1],d.p[2]);
      tracer(from,to,0xff8a5c);spark(to,0xff8a5c);
      const dist=camera.position.distanceTo(from);if(dist<30)sfxShot(clamp(.4-dist*.012,.05,.4),.7);
      if(d.v===myId&&d.d>0)applyDamage(d.d,'бот');break;}
    case 'sc': player.score=d.s;player.kills=d.k;if(d.w>waveN){waveN=d.w;updHUD();}break;
  }
}
function d0(r,d){r.last=performance.now();}
function applyBotsState(d){
  const seen=new Set();
  for(const e of d.bs){
    const[id,x,z,ry,hp,anim,dead]=e;seen.add(id);
    let b=bots.get(id);
    if(!b){b=makeBot(id,x,z);bots.set(id,b);}
    b.tx=x;b.tz=z;b.t_ry=ry;b.hp=hp;b.animR=anim;b.deadR=dead;
  }
  for(const[id,b]of[...bots]){if(!seen.has(id)&&!b.dead){b.dead=true;b.deadT=0;}}
  if(d.w>waveN){waveN=d.w;showBanner('ВОЛНА '+waveN);sfx.wave();}
  player.score=d.s;player.kills=d.k;updHUD();
}

/* ---------- game state / boot ---------- */
let state='menu';
function resetWorld(){
  for(const[,b]of[...bots])removeBot(b);bots.clear();
  for(const[cid,r]of[...remotes]){scene.remove(r.grp);}remotes.clear();
  botSeq=1;waveN=0;spawnQ=0;player.x=0;player.z=24;player.y=0;player.vy=0;player.ry=Math.PI;player.pitch=0;
  player.hp=100;player.dead=false;player.mag=30;player.reloading=0;player.score=0;player.kills=0;respawnT=0;
  $('kf').innerHTML='';$('kf').style.display='none';$('vig').style.opacity=0;
}
function startGame(m,code){
  mode=m;resetWorld();
  if(m==='coop'&&code){isHost=false;myId=0;netConnect(code);}else{net.on=false;isHost=true;myId=0;}
  state='play';
  $('menu').style.display='none';$('go').style.display='none';$('hud').style.display='block';
  audioInit();
  setTimeout(()=>{if(state==='play')canvas.requestPointerLock();},100);
  updHUD();
  setTimeout(()=>{if(state==='play'&&(isHost||!net.on))startWave(1);},1500);
}
function showPause(on){
  $('pause').style.display=on?'flex':'none';
  if(!on&&state==='play')canvas.requestPointerLock();
}
$('bResume').onclick=()=>showPause(false);
$('bMenu').onclick=$('bMenu2').onclick=()=>{
  state='menu';showPause(false);$('hud').style.display='none';$('go').style.display='none';$('menu').style.display='flex';
  try{net.ws&&net.ws.close();}catch(_){}
  net.on=false;resetWorld();document.exitPointerLock();
};
$('bAgain').onclick=()=>{startGame(mode,roomCode);};
$('nick').value=nick;
$('nick').onchange=()=>localStorage.setItem('arenaNick',$('nick').value.trim()||'игрок');
$('bSolo').onclick=()=>{audioInit();startGame('solo',null);};
$('bCreate').onclick=()=>{
  const code=Array.from({length:4},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*31)]).join('');
  audioInit();startGame('coop',code);
  const link=location.origin+location.pathname+'#room='+code;
  navigator.clipboard&&navigator.clipboard.writeText(link);
  toast('комната '+code+' · ссылка скопирована');
};
$('bJoin').onclick=()=>{
  const c=$('code').value.trim().toUpperCase();
  if(c.length<3){toast('введи код комнаты');return;}
  audioInit();startGame('coop',c);
};
if(location.hash.startsWith('#room=')){
  const c=location.hash.slice(6).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
  if(c.length>=3){$('code').value=c;toast('комната '+c+' — жми «Войти»');}
}

function botDeath(b,dt){
  b.deadT+=dt;
  b.grp.rotation.x=Math.min(Math.PI/2,b.grp.rotation.x+dt*4);
  b.grp.position.y=-Math.min(1,b.deadT)*.1;
  b.grp.traverse(o=>{if(o.material&&o.material.opacity!==undefined){o.material.transparent=true;o.material.opacity=Math.max(0,1-b.deadT/1.4);}});
  if(b.deadT>1.6){removeBot(b);bots.delete(b.id);}
}
function clientBot(b,dt){
  if(b.tx===undefined)return;
  const k=Math.min(1,10*dt);
  b.x+=(b.tx-b.x)*k;b.z+=(b.tz-b.z)*k;b.ry+=(b.t_ry-b.ry)*k;
  if(b.deadR&&!b.dead){b.dead=true;sfx.ekill();}
  b.grp.position.set(b.x,Math.abs(Math.sin(performance.now()/180))*.05,b.z);
  b.grp.rotation.y=b.ry;
}
function remoteAnim(r,dt){
  const k=Math.min(1,12*dt);
  r.x+=(r.tx-r.x)*k;r.y+=(r.ty-r.y)*k;r.z+=(r.tz-r.z)*k;r.ry+=(r.t_ry-r.ry)*k;
  r.grp.position.set(r.x,r.y,r.z);r.grp.rotation.y=r.ry;
  r.body.material.emissive=r.body.material.emissive||new THREE.Color(0);
}

/* ---------- main loop ---------- */
let lastT=performance.now();
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now(),dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(state==='play'){
    movePlayer(dt);
    // fire / reload / regen
    if(mouseDown&&!player.dead&&locked)fire();
    if(player.reloading>0){player.reloading-=dt;if(player.reloading<=0){player.mag=30;gun.position.z=-.35;}}
    if(!player.dead&&now-player.lastHurt>6000&&player.hp<100){player.hp=Math.min(100,player.hp+8*dt);updHUD();}
    if(player.dead){respawnT-=dt;if(respawnT<=0&&mode==='coop'){respawn();}}
    // waves & bots
    updWaves(dt);
    const targets=[{x:player.x,z:player.z,hp:player.dead?0:player.hp,me:true}];
    for(const[cid,r]of remotes)targets.push({x:r.tx,z:r.tz,hp:r.dead?0:r.hp,id:cid});
    for(const[id,b]of[...bots]){
      if(b.dead){botDeath(b,dt);continue;}
      if(isHost||!net.on){
        botAI(b,dt,targets);
        b.grp.position.set(b.x,Math.abs(Math.sin(now/160+b.id))*.05,b.z);
        b.grp.rotation.y=b.ry;
      } else clientBot(b,dt);
    }
    // remotes
    for(const[cid,r]of remotes)remoteAnim(r,dt);
    // net throttles
    if(net.on&&net.alive){
      if(now-net.sT>100){net.sT=now;
        netSend({t:'s',x:+player.x.toFixed(2),y:+player.y.toFixed(2),z:+player.z.toFixed(2),ry:+player.ry.toFixed(2),p:+player.pitch.toFixed(2),hp:Math.round(player.hp),d:player.dead,n:nick});}
      if((isHost)&&now-net.bT>100){net.bT=now;
        const bs=[];for(const[id,b]of bots)bs.push([id,+b.x.toFixed(1),+b.z.toFixed(1),+b.ry.toFixed(2),Math.round(b.hp),b.anim,b.dead?1:0]);
        netSend({t:'b',bs,w:waveN,s:player.score,k:player.kills});}
    }
    // camera
    const targetY=player.dead?.55:1.65;
    camera.position.set(player.x,camera.position.y+((player.y+targetY)-camera.position.y)*Math.min(1,10*dt),player.z);
    camera.rotation.order='YXZ';
    camera.rotation.set(player.pitch,player.ry,player.dead?-.5:0);
    recoil=Math.max(0,recoil-dt*8);
    gun.position.z=-.35+recoil*.07;
    gun.position.x=.22;
    gun.position.y=-.18+recoil*.02+Math.sin(now/140)*.004;
    updFx(dt);
  }
  renderer.render(scene,camera);
}
loop();
</script>
</body>
